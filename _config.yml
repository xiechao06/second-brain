# Jekyll configuration for GitHub Pages with Mermaid support

# Site settings
title: My Brain
description: A personal knowledge management system

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    line_numbers: false

# GitHub Pages settings
theme: jekyll-theme-primer

plugins:
  - jekyll-seo-tag

# Exclude files from the build
exclude:
  - .gitignore
  - .github
  - node_modules
  - vendor
  - "*.mmd"
  - README.md
  - _slides

# Enable future posts
future: false

# Liquid settings
liquid:
  error_mode: strict
