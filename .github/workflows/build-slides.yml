# Marp build script for GitHub Actions
# Converts all Markdown files in _slides/ to slides/*.html using Marp CLI

name: Build Slides with Marp

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-slides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli
      - name: Build slides
        run: |
          mkdir -p slides
          for file in _slides/*.md; do
            [ -e "$file" ] || continue
            filename=$(basename "$file" .md)
            marp "$file" --html --output "slides/$filename.html"
          done
      - name: Upload slides artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: slides/
